# Repeated in every location that sets its own add_header, because nginx drops the
# server-level add_header directives in a location that has any of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Uncomment once HTTPS works and you are sure the domain stays HTTPS-only:
# add_header Strict-Transport-Security "max-age=31536000" always;
