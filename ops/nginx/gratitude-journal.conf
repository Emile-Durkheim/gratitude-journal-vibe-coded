# Gratitude Journal: static PWA served from the release that `current` points at.
# Installed by ops/setup-server.sh as /etc/nginx/sites-available/gratitude-journal.conf,
# with __DOMAIN__ and __DEPLOY_ROOT__ replaced. Certbot adds the HTTPS listener and the
# HTTP -> HTTPS redirect to this file (`certbot --nginx`).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __DEPLOY_ROOT__/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    include snippets/gratitude-journal-headers.conf;

    # Hashed build output never changes under the same name.
    location /assets/ {
        include snippets/gratitude-journal-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry points must be revalidated on every load, or a new deploy never reaches
    # installed apps (the service worker decides when to switch to fresh assets).
    location ~ ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        include snippets/gratitude-journal-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include snippets/gratitude-journal-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # The app routes with #/..., so every real request maps to a file.
    location / {
        include snippets/gratitude-journal-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
